<style>
@font-face{font-family:'Fragment Mono';src:url('/fonts/fragment-mono-latin.woff2') format('woff2');font-display:swap;font-weight:400}
@font-face{font-family:'Inter';src:url('/images/grgckwrn6d3uz8ewclhzxwefc4.woff2') format('woff2');font-display:swap;font-weight:400}
@font-face{font-family:'Inter';src:url('/images/d3thnaqiaeqie5hgcrw4mmgwyu.woff2') format('woff2');font-display:swap;font-weight:500}
@font-face{font-family:'Inter';src:url('/images/syrnpwzamircj3wilpip43kjqs.woff2') format('woff2');font-display:swap;font-weight:700}
:root{--bg:#000;--side:#0a0a0a;--card:#171717;--line:#262626;--text:#fff;--mute:#a3a3a3;--accent:#fff;--accent-ink:#000}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.top{border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);z-index:5;flex:none}
.topl,.topr{display:flex;align-items:center;gap:10px}
.cta-top{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:13px;padding:8px 16px;border-radius:999px;white-space:nowrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--text);text-decoration:none}
.logo-mark{display:block;width:28px;height:28px;background-color:currentColor;-webkit-mask:url('/images/favicon.png') center/contain no-repeat;mask:url('/images/favicon.png') center/contain no-repeat}
#left{color:var(--mute);font-size:13px;font-family:'Fragment Mono',ui-monospace,monospace}
#menu{display:none;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:4px 9px;font-size:16px;cursor:pointer}
.wrap{flex:1;display:flex;min-height:0}
aside{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#newChat{margin:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
#newChat:hover{border-color:var(--accent)}
.side-label{font-family:'Fragment Mono',ui-monospace,monospace;font-size:11px;color:var(--mute);padding:4px 16px;text-transform:uppercase;letter-spacing:.04em}
#chats{flex:1;overflow-y:auto;padding:4px 8px 12px}
#chats button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chats button:hover{background:var(--card)}
#chats button.on{background:var(--card);color:var(--accent)}
#chats .empty{font-size:13px;color:var(--mute);padding:8px 10px}
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#log{flex:1;overflow-y:auto;padding:20px}
.col{max-width:720px;margin:0 auto}
.m{margin:0 0 16px;display:flex}
.m.u{justify-content:flex-end}
.b{max-width:88%;padding:12px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.u .b{background:var(--accent);color:var(--accent-ink)}
.a .b{background:var(--card);border:1px solid var(--line)}
.b ul,.b ol{margin:6px 0;padding-left:22px}
.sugg{display:grid;gap:10px;margin-top:8px}
.sugg button{text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer}
.sugg button:hover{border-color:var(--accent)}
h2{font-size:24px;margin:8px 0}
.mute{color:var(--mute)}
#f{border-top:1px solid var(--line);padding:14px 20px;flex:none}
.row{display:flex;gap:10px}
textarea{flex:1;resize:none;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--side);color:var(--text);font:inherit;max-height:140px}
textarea::placeholder{color:#525252}
#q:placeholder-shown{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea:focus{outline:none;border-color:var(--text)}
#send{padding:0 22px;border:0;border-radius:999px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
#send:disabled{opacity:.5}
.cta{background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:16px;margin:8px 0 16px}
.cta a{color:var(--accent-ink);background:var(--accent);padding:8px 18px;border-radius:999px;text-decoration:none;font-weight:700;display:inline-block;margin-top:8px}
.err{color:#ff8f8f}
.fb{margin-top:8px;display:flex;gap:6px;align-items:center}
.fb button{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.fb button:hover{border-color:var(--accent);color:var(--accent)}
.fb .thanks{font-size:12px;color:var(--mute)}
.fb textarea{flex:1;min-height:34px;padding:6px 8px;font-size:13px}
.login{display:grid;gap:10px;max-width:420px;margin:12px 0}
.login input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--side);color:var(--text);font-size:16px}
.login button{padding:12px;border:0;border-radius:999px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.login .msg{font-size:14px;color:var(--mute);min-height:18px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
#shade{display:none}
@media(max-width:800px){
  #menu{display:inline-block}
  aside{position:fixed;top:0;bottom:0;left:0;z-index:20;transform:translateX(-100%);transition:transform .2s}
  body.side-open aside{transform:none}
  body.side-open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
}
@media(max-width:480px){.cta-top{font-size:12px;padding:7px 10px}#left{display:none}#log{padding:16px}#f{padding:12px 16px}}
body.locked aside,body.locked #menu,body.locked #f{display:none}

<body>
<div class="top">
  <div class="topl"><button id="menu" type="button" aria-label="Show chats">☰</button><a class="logo" href="/bot" aria-label="Seba AI"><span class="logo-mark" aria-hidden="true"></span>Seba AI</a></div>
  <div class="topr"><span id="left"></span><a class="cta-top" id="ctaTop" href="#" target="_blank" rel="noopener" data-cta="true">Want to go deeper? Book a call</a></div>
</div>
<div class="wrap">
  <aside>
    <button id="newChat" type="button">+ New chat</button>
    <div class="side-label">Your chats</div>
    <nav id="chats"></nav>
  </aside>
  <div id="shade"></div>
  <main>
    <div id="log"><div class="col" id="col"></div></div>
    <form id="f"><div class="col row">
      <textarea id="q" rows="1" maxlength="600" placeholder="Ask about angles, creative, landing pages, Meta ads…" aria-label="Your question"></textarea>
      <button id="send" type="submit">Ask</button>
    </div></form>
  </main>
</div>
<script>
// ---- CONFIG ----
const CHAT_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-chat';
const HISTORY_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-history';
const LOGIN_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-signup';
const FEEDBACK_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-feedback';
const LANDING_URL = 'https://sebaagency.com/bot';
const CTA = { text: 'Want help applying this to your brand? Book a free strategy call.', label: 'Book a call', url: 'https://calendly.com/joshua-sebaagency/30min' };
const CTA_EVERY = 4; // show the CTA after every Nth answer
document.getElementById('ctaTop').href = CTA.url;
// -----------------
const $=id=>document.getElementById(id);
const col=$('col'),log=$('log'),q=$('q'),send=$('send'),left=$('left'),chatsEl=$('chats');
let token=null;try{const p=new URLSearchParams(location.search).get('k');if(p){localStorage.setItem('ebk',p);history.replaceState(null,'',location.pathname);}token=localStorage.getItem('ebk');}catch(_){token=new URLSearchParams(location.search).get('k');}
let chatId=null,hist=[],chats=[],answers=0,loadSeq=0;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function md(s){
  let h=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const lines=h.split('\n'),out=[];let list=null;
  for(const l of lines){
    const ul=l.match(/^\s*[-*•]\s+(.*)/),ol=l.match(/^\s*\d+[.)]\s+(.*)/);
    const t=ul?'ul':ol?'ol':null;
    if(t){if(list!==t){if(list)out.push('</'+list+'>');out.push('<'+t+'>');list=t;}out.push('<li>'+(ul||ol)[1]+'</li>');}
    else{if(list){out.push('</'+list+'>');list=null;}out.push(l);}
  }
  if(list)out.push('</'+list+'>');
  return out.join('\n').replace(/\n(<\/?(ul|ol|li))/g,'$1').replace(/(<\/(ul|ol)>)\n/g,'$1');
}
function add(role,html){
  const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');
  const b=document.createElement('div');b.className='b';b.innerHTML=html;
  d.appendChild(b);col.appendChild(d);log.scrollTop=log.scrollHeight;return b;
}
function setLeft(n){if(typeof n==='number')left.textContent=Math.max(n,0)+' questions left today';}
function closeSide(){document.body.classList.remove('side-open');}

function renderChats(){
  chatsEl.innerHTML='';
  if(!chats.length){chatsEl.innerHTML='<div class="empty">Your chats will show up here.</div>';return;}
  chats.forEach(c=>{
    const b=document.createElement('button');b.type='button';b.textContent=c.title||'New chat';b.title=c.title||'';
    if(c.chatId===chatId)b.className='on';
    b.onclick=()=>{closeSide();if(c.chatId!==chatId)openChat(c.chatId);};
    chatsEl.appendChild(b);
  });
}
function welcome(){
  col.innerHTML='<h2>Welcome to the Seba AI chat.</h2><p class="mute">Ask any ecommerce question: angles, creative, landing pages, Meta and Google ads, email, sourcing, unit economics. Try one of these:</p><div class="sugg"></div>';
  const s=col.querySelector('.sugg');
  ['How do I find a winning angle for my product?','What makes a strong hook for a video ad?','How should I structure a Meta ad testing campaign?','Why is my landing page not converting?'].forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{q.value=t;ask();};s.appendChild(b);});
}
function newChat(){chatId=null;hist=[];answers=0;loadSeq++;welcome();renderChats();closeSide();q.focus();}

function noAccess(msg){
  document.body.classList.add('locked');
  col.innerHTML='<h2>Open Seba AI</h2><p class="mute">'+(msg||'Enter the email you signed up with and we send you a fresh login link.')+'</p>'+
  '<form id="lf" class="login"><input id="le" type="email" placeholder="you@brand.com" autocomplete="email" required><button type="submit">Send login link</button><div class="msg" id="lm"></div></form>'+
  '<p class="mute" style="font-size:13px">New here? <a href="'+LANDING_URL+'" style="color:var(--accent)">Get free access</a>.</p>';
  const lf=$('lf'),lm=$('lm'),le=$('le');
  lf.addEventListener('submit',async e=>{
    e.preventDefault();const email=le.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){lm.textContent='Please enter a valid email.';return;}
    lf.querySelector('button').disabled=true;lm.textContent='Sending…';
    try{
      const r=await fetch(LOGIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'login',email})});
      const j=await r.json().catch(()=>({}));
      if(j.known===false){lm.innerHTML='No account for that email yet. <a href="'+LANDING_URL+'" style="color:var(--accent)">Sign up here</a>.';lf.querySelector('button').disabled=false;return;}
      lm.textContent='Check your inbox and click the link to open the chat.';
    }catch(_){lm.textContent='Something went wrong. Try again.';lf.querySelector('button').disabled=false;}
  });
}
async function fetchHistory(id){
  const r=await fetch(HISTORY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,chatId:id||''})});
  if(r.status===401){try{localStorage.removeItem('ebk');}catch(_){}token=null;noAccess('Your link has expired. Enter your email to get a new one.');return null;}
  return r.json().catch(()=>({}));
}
async function init(){
  welcome();
  try{
    const j=await fetchHistory('');if(!j)return;
    chats=Array.isArray(j.chats)?j.chats:[];setLeft(j.remaining);renderChats();
  }catch(_){renderChats();}
}
async function openChat(id){
  const seq=++loadSeq;chatId=id;hist=[];answers=0;renderChats();
  col.innerHTML='<div class="m a"><div class="b"><span class="dots"><span></span><span></span><span></span></span></div></div>';
  try{
    const j=await fetchHistory(id);if(!j||seq!==loadSeq)return;
    if(Array.isArray(j.chats)){chats=j.chats;renderChats();}
    setLeft(j.remaining);
    const msgs=Array.isArray(j.messages)?j.messages:[];
    col.innerHTML='';
    if(!msgs.length){welcome();return;}
    msgs.forEach(m=>{const c=String(m.content||'');if(m.role==='assistant')add('a',md(c));else add('user',esc(c));hist.push({role:m.role==='assistant'?'assistant':'user',content:c});});
    log.scrollTop=log.scrollHeight;
  }catch(_){if(seq===loadSeq)col.innerHTML='<p class="err">Could not load this chat. Try again.</p>';}
}
function addFeedback(bubble,question,answer){
  const w=document.createElement('div');w.className='fb';
  const up=document.createElement('button');up.type='button';up.textContent='👍 Helpful';
  const dn=document.createElement('button');dn.type='button';dn.textContent='👎 Not quite';
  w.append(up,dn);bubble.appendChild(w);
  const post=async(signal,comment)=>{try{await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,question,answerStart:answer.slice(0,300),signal,comment:comment||''})});}catch(_){}};
  up.onclick=()=>{post('up');w.innerHTML='<span class="thanks">Thanks.</span>';};
  dn.onclick=()=>{
    w.innerHTML='';const ta=document.createElement('textarea');ta.placeholder='What was missing? (optional)';ta.maxLength=400;
    const ok=document.createElement('button');ok.type='button';ok.textContent='Send';
    w.append(ta,ok);ta.focus();
    ok.onclick=()=>{post('down',ta.value.trim());w.innerHTML='<span class="thanks">Thanks, that helps us improve it.</span>';};
  };
}
async function ask(){
  const text=q.value.trim();if(!text||send.disabled)return;
  if(!col.querySelector('.m'))col.innerHTML='';
  add('user',esc(text));q.value='';q.style.height='auto';send.disabled=true;
  const seq=loadSeq;
  const t=add('a','<span class="dots"><span></span><span></span><span></span></span>');
  try{
    const r=await fetch(CHAT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,question:text,chatId:chatId||'',history:hist.slice(-6)})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){noAccess();return;}
    if(r.status===429){t.innerHTML='<span class="err">You have used today\'s free questions. Come back tomorrow.</span>';setLeft(0);return;}
    if(!r.ok||!j.answer)throw new Error();
    if(seq!==loadSeq)return; // user switched chats while waiting
    t.innerHTML=md(j.answer);
    addFeedback(t,text,j.answer);
    hist.push({role:'user',content:text},{role:'assistant',content:j.answer});
    setLeft(j.remaining);
    if(j.chatId){
      chatId=j.chatId;
      chats=[{chatId:j.chatId,title:j.title||text,lastAt:new Date().toISOString()}].concat(chats.filter(c=>c.chatId!==j.chatId));
      renderChats();
    }
    answers++;
    if(CTA_EVERY&&answers%CTA_EVERY===0){const c=document.createElement('div');c.className='cta';c.innerHTML=esc(CTA.text)+'<br><a href="'+CTA.url+'" target="_blank" rel="noopener">'+esc(CTA.label)+'</a>';col.appendChild(c);}
  }catch(_){t.innerHTML='<span class="err">Something went wrong. Please try again.</span>';}
  finally{send.disabled=false;log.scrollTop=log.scrollHeight;q.focus();}
}
$('f').addEventListener('submit',e=>{e.preventDefault();ask();});
$('newChat').onclick=newChat;
$('menu').onclick=()=>document.body.classList.toggle('side-open');
$('shade').onclick=closeSide;
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=q.scrollHeight+'px';});
if(token)init();else noAccess();
</script>
</body>
</html>
