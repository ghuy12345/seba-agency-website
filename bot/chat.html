<style>
/* Seba Agency brand: monochrome black/white, Inter, logo mark */
@font-face{font-family:'Inter';src:url('/images/grgckwrn6d3uz8ewclhzxwefc4.woff2') format('woff2');font-display:swap;font-weight:400}
@font-face{font-family:'Inter';src:url('/images/d3thnaqiaeqie5hgcrw4mmgwyu.woff2') format('woff2');font-display:swap;font-weight:500}
@font-face{font-family:'Inter';src:url('/images/syrnpwzamircj3wilpip43kjqs.woff2') format('woff2');font-display:swap;font-weight:700}
:root{--bg:#000;--card:#0a0a0a;--line:#262626;--text:#fff;--mute:#a3a3a3;--accent:#fff;--accent-ink:#000}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top{border-bottom:1px solid rgba(38,38,38,.5);padding:0 16px;height:64px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:rgba(17,17,17,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5}
.topr{display:flex;align-items:center;gap:12px}
.cta-top{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14px;padding:8px 18px;border-radius:999px;white-space:nowrap;transition:background-color .2s}
.cta-top:hover{background:#f5f5f5}
@media(max-width:420px){.cta-top{font-size:12px;padding:7px 12px}#left{display:none}}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--text);text-decoration:none}
.logo-mark{display:block;width:32px;height:32px;background-color:currentColor;-webkit-mask:url('/images/favicon.png') center/contain no-repeat;mask:url('/images/favicon.png') center/contain no-repeat}
#left{color:var(--mute);font-size:13px;font-family:'Fragment Mono',ui-monospace,monospace}
#log{flex:1;overflow-y:auto;padding:24px 16px}
.col{max-width:720px;margin:0 auto}
.m{margin:0 0 16px;display:flex}
.m.u{justify-content:flex-end}
.b{max-width:88%;padding:12px 16px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.u .b{background:var(--accent);color:var(--accent-ink)}
.a .b{background:var(--card);border:1px solid var(--line)}
.b ul,.b ol{margin:6px 0;padding-left:22px}
.src{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.sugg{display:grid;gap:10px;margin-top:16px}
.sugg button{text-align:left;background:transparent;color:#d4d4d4;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;font-size:15px;cursor:pointer;transition:border-color .2s,color .2s}
.sugg button:hover{border-color:#737373;color:var(--text)}
h2{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.01em;margin:16px 0 8px}
.mute{color:var(--mute)}
#f{border-top:1px solid #171717;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.row{display:flex;gap:10px}
textarea{flex:1;resize:none;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;max-height:140px}
textarea::placeholder{color:#525252}
#q:placeholder-shown{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea:focus{outline:none;border-color:var(--text)}
#send{padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5}
.cta{background:var(--card);border:1px solid #525252;border-radius:16px;padding:16px;margin:8px 0 16px}
.cta a{color:var(--accent-ink);background:var(--accent);padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;display:inline-block;margin-top:10px}
.err{color:#f87171}
.fb{margin-top:8px;display:flex;gap:6px;align-items:center}
.fb button{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer}
.fb button:hover,.fb button.on{border-color:var(--text);color:var(--text)}
.fb .thanks{font-size:12px;color:var(--mute)}
.fb textarea{flex:1;min-height:34px;padding:6px 8px;font-size:13px}
.login{display:grid;gap:10px;max-width:420px;margin:16px 0}
.login input{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px}
.login input:focus{outline:none;border-color:var(--text)}
.login button{padding:14px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer}
.login .msg{font-size:14px;color:var(--mute);min-height:18px}
.login .msg a,.mute a{color:var(--text)!important;text-decoration:underline;text-underline-offset:3px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="top"><a class="logo" href="/bot" aria-label="Seba AI"><span class="logo-mark" aria-hidden="true"></span>Seba AI</a><div class="topr"><span id="left"></span><a class="cta-top" id="ctaTop" href="#" target="_blank" rel="noopener" data-cta="true">Want to go deeper? Book a call</a></div></div>
<div id="log"><div class="col" id="col"></div></div>
<form id="f"><div class="col row">
<textarea id="q" rows="1" maxlength="600" placeholder="Ask about angles, creative, landing pages, Meta ads…" aria-label="Your question"></textarea>
<button id="send" type="submit">Ask</button></div></form>
<script>
// ---- CONFIG ----
const CHAT_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-chat';
const HISTORY_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-history';
const LOGIN_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-signup';
const FEEDBACK_URL = 'https://n8n.apps.sebaagency.com/webhook/brain-feedback';
const LANDING_URL = '/bot';
const CTA = { text: 'Want help applying this to your brand? Book a free strategy call.', label: 'Book a call', url: 'https://calendly.com/joshua-sebaagency/30min' };
const CTA_EVERY = 4; // show the CTA after every Nth answer
document.getElementById('ctaTop').href = CTA.url;
// -----------------
const col=document.getElementById('col'),log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send'),left=document.getElementById('left');
let token=null;try{const p=new URLSearchParams(location.search).get('k');if(p){localStorage.setItem('ebk',p);history.replaceState(null,'',location.pathname);}token=localStorage.getItem('ebk');}catch(_){token=new URLSearchParams(location.search).get('k');}
const hist=[];let answers=0;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(s){
  let h=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const lines=h.split('\n'),out=[];let list=null;
  for(const l of lines){
    const ul=l.match(/^\s*[-*•]\s+(.*)/),ol=l.match(/^\s*\d+[.)]\s+(.*)/);
    const t=ul?'ul':ol?'ol':null;
    if(t){if(list!==t){if(list)out.push('</'+list+'>');out.push('<'+t+'>');list=t;}out.push('<li>'+(ul||ol)[1]+'</li>');}
    else{if(list){out.push('</'+list+'>');list=null;}out.push(l);}
  }
  if(list)out.push('</'+list+'>');
  return out.join('\n').replace(/\n(<\/?(ul|ol|li))/g,'$1').replace(/(<\/(ul|ol)>)\n/g,'$1');
}
function add(role,html,srcs){
  const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');
  const b=document.createElement('div');b.className='b';b.innerHTML=html;
  if(srcs&&srcs.length){const s=document.createElement('div');s.className='src';srcs.forEach(x=>{const c=document.createElement('span');c.className='chip';c.textContent=x.title;s.appendChild(c);});b.appendChild(s);}
  d.appendChild(b);col.appendChild(d);log.scrollTop=log.scrollHeight;return b;
}
function welcome(){
  col.innerHTML='<h2>Welcome to the Seba AI chat.</h2><p class="mute">Ask any ecommerce question: angles, creative, landing pages, Meta and Google ads, email, sourcing, unit economics. Try one of these:</p><div class="sugg"></div>';
  const s=col.querySelector('.sugg');
  ['How do I find a winning angle for my product?','What makes a strong hook for a video ad?','How should I structure a Meta ad testing campaign?','Why is my landing page not converting?'].forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{q.value=t;ask();};s.appendChild(b);});
}
function noAccess(msg){
  document.getElementById('f').style.display='none';
  col.innerHTML='<h2>Open Seba AI</h2><p class="mute">'+(msg||'Enter the email you signed up with and we send you a fresh login link.')+'</p>'+
  '<form id="lf" class="login"><input id="le" type="email" placeholder="you@brand.com" autocomplete="email" required><button type="submit">Send login link</button><div class="msg" id="lm"></div></form>'+
  '<p class="mute" style="font-size:13px">New here? <a href="'+LANDING_URL+'" style="color:var(--accent)">Get free access</a>.</p>';
  const lf=document.getElementById('lf'),lm=document.getElementById('lm'),le=document.getElementById('le');
  lf.addEventListener('submit',async e=>{
    e.preventDefault();const email=le.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){lm.textContent='Please enter a valid email.';return;}
    lf.querySelector('button').disabled=true;lm.textContent='Sending…';
    try{
      const r=await fetch(LOGIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'login',email})});
      const j=await r.json().catch(()=>({}));
      if(j.known===false){lm.innerHTML='No account for that email yet. <a href="'+LANDING_URL+'" style="color:var(--accent)">Sign up here</a>.';lf.querySelector('button').disabled=false;return;}
      lm.textContent='Check your inbox and click the link to open the chat.';
    }catch(_){lm.textContent='Something went wrong. Try again.';lf.querySelector('button').disabled=false;}
  });
}
async function loadHistory(){
  try{
    const r=await fetch(HISTORY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    if(r.status===401){try{localStorage.removeItem('ebk');}catch(_){ }token=null;noAccess('Your link has expired. Enter your email to get a new one.');return;}
    const j=await r.json().catch(()=>({}));
    const msgs=Array.isArray(j.messages)?j.messages:[];
    if(!msgs.length){welcome();return;}
    col.innerHTML='';
    msgs.forEach(m=>{if(m.role==='assistant'){add('a',md(String(m.content||'')),(m.sources||[]).map(t=>({title:t})));}else{add('user',esc(String(m.content||'')));}hist.push({role:m.role==='assistant'?'assistant':'user',content:String(m.content||'')});});
    const d=document.createElement('p');d.className='mute';d.style.cssText='font-size:12px;text-align:center';d.textContent='Earlier conversation restored. Conversations are kept for 90 days.';col.appendChild(d);
    log.scrollTop=log.scrollHeight;
  }catch(_){welcome();}
}
function addFeedback(bubble,question,answer){
  const w=document.createElement('div');w.className='fb';
  const up=document.createElement('button');up.type='button';up.textContent='👍 Helpful';
  const dn=document.createElement('button');dn.type='button';dn.textContent='👎 Not quite';
  w.append(up,dn);bubble.appendChild(w);
  const send=async(signal,comment)=>{try{await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,question,answerStart:answer.slice(0,300),signal,comment:comment||''})});}catch(_){}};
  up.onclick=()=>{send('up');w.innerHTML='<span class="thanks">Thanks.</span>';};
  dn.onclick=()=>{
    w.innerHTML='';const ta=document.createElement('textarea');ta.placeholder='What was missing? (optional)';ta.maxLength=400;
    const ok=document.createElement('button');ok.type='button';ok.textContent='Send';
    w.append(ta,ok);ta.focus();
    ok.onclick=()=>{send('down',ta.value.trim());w.innerHTML='<span class="thanks">Thanks, that helps us improve it.</span>';};
  };
}
async function ask(){
  const text=q.value.trim();if(!text||send.disabled)return;
  if(!col.querySelector('.m'))col.innerHTML='';
  add('user',esc(text));q.value='';q.style.height='auto';send.disabled=true;
  const t=add('a','<span class="dots"><span></span><span></span><span></span></span>');
  try{
    const r=await fetch(CHAT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,question:text,history:hist.slice(-6)})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){t.closest('.m').remove();noAccess();return;}
    if(r.status===429){t.innerHTML='<span class="err">You have used today\'s free questions. Come back tomorrow.</span>';left.textContent='0 left today';return;}
    if(!r.ok||!j.answer)throw new Error();
    t.innerHTML=md(j.answer);
    if(j.sources&&j.sources.length){const s=document.createElement('div');s.className='src';j.sources.forEach(x=>{const c=document.createElement('span');c.className='chip';c.textContent=x.title;s.appendChild(c);});t.appendChild(s);}
    addFeedback(t,text,j.answer);
    hist.push({role:'user',content:text},{role:'assistant',content:j.answer});
    if(typeof j.remaining==='number')left.textContent=Math.max(j.remaining,0)+' questions left today';
    answers++;
    if(CTA_EVERY&&answers%CTA_EVERY===0){const c=document.createElement('div');c.className='cta';c.innerHTML=esc(CTA.text)+'<br><a href="'+CTA.url+'" target="_blank" rel="noopener">'+esc(CTA.label)+'</a>';col.appendChild(c);}
  }catch(_){t.innerHTML='<span class="err">Something went wrong. Please try again.</span>';}
  finally{send.disabled=false;log.scrollTop=log.scrollHeight;q.focus();}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();ask();});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=q.scrollHeight+'px';});
if(token)loadHistory();else noAccess();
</script>
</body>
</html>
